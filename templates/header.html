<header class="blog-header">
    <h1><a href="{{ SITEURL }}">{{ SITENAME }}</a></h1>
    <p>{% if SITESUBTITLE %}{{ SITESUBTITLE }}{% endif %}</p>
    <div class="header-controls">
        <nav aria-label="Main navigation">
            <a href="{{ SITEURL }}/{% if ARCHIVES_URL %}{{ ARCHIVES_URL }}{% else %}archives{% endif %}">ARCHIVES</a>
            <a href="{{ SITEURL }}/{% if CATEGORIES_URL %}{{ CATEGORIES_URL }}{% else %}categories{% endif %}">CATEGORIES</a>
            <a href="{{ SITEURL }}/{% if TAGS_URL %}{{ TAGS_URL }}{% else %}tags{% endif %}">TAGS</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
            <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
            </svg>
        </button>
    </div>
</header>
